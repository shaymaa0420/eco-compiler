    <!-- Missing width/height, has alt -->
    <img src="photo2.jpg" alt="a photo" width="200" height="200">

    <!-- Has width/height, missing alt -->
    <img src="photo3.jpg" width="200" height="200" alt="description">

    <!-- Autoplay media -->
    <video src="video1.mp4" autoplay></video>
    <audio src="sound1.mp3" autoplay></audio>

    <!-- Lots of inline styles -->
    <p>This paragraph has an inline style.</p>
    <p>So does this one.</p>
